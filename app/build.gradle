plugins { id 'com.android.application' }
android {
    namespace 'tj.bilimdon.app'
    compileSdk 35
    defaultConfig {
        applicationId "tj.bilimdon.app"
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName "4.1"
    }
    signingConfigs {
        bd {
            storeFile file('bilimdon.jks')
            storePassword 'bilimdon2026'
            keyAlias 'bilimdon'
            keyPassword 'bilimdon2026'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.bd }
        release { minifyEnabled false; signingConfig signingConfigs.bd }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

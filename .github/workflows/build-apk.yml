name: APK йиғиш
on:
  push:
    paths-ignore: ['app/src/main/assets/index.html', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: chmod +x gradlew && ./gradlew assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk Bilimdon.apk
      - uses: actions/upload-artifact@v4
        with: { name: Bilimdon-APK, path: Bilimdon.apk }
      - name: Доимий юклаб олиш ҳаволаси (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Билимдон (охирги версия)
          body: "Ўрнатиш: Bilimdon.apk'ни юклаб олинг ва очинг. Кейинги янгиликлар илованинг ўзига автоматик келади."
          files: Bilimdon.apk
          make_latest: true
